name: Backend CI

on:
    push:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - name: Restore NuGet-packs
              working-directory: WeatherAPI
              run: dotnet restore
            - name: build app
              working-directory: WeatherAPI
              run: dotnet build
            - name: test stuff
              working-directory: WeatherAPI.Tests
              run: dotnet run test
