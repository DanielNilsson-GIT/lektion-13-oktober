name: Backend CI

on:
    push:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - name: Restore NuGet-packs
              working-directory: WeatherAPI
              run: dotnet restore
            - name: build app
              working-directory: WeatherAPI
              run: dotnet build
            - name: test stuff
              working-directory: WeatherAPI
              run: dotnet test
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKER_TOKEN}}
            - name: Build Docker Image
              working-directory: ./WeatherAPI/WeatherAPI
              run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/weatherapi:${{github.sha}} .
            - name: push dockerimage
              run: docker push ${{secrets.DOCKERHUB_USERNAME}}/weatherapi:${{github.sha}}
            - name: Deploy to Azure Web app
              uses: azure/webapps-deploy@v3
              with:
                  app-name: SUT25lesson-weatherapidaniel
                  publish-profile: ${{secrets.AZURE_WEBAPP_PUBLISH_PROFILE}}
                  images: ${{secrets.DOCKERHUB_USERNAME}}/weatherapi:${{github.sha}}
